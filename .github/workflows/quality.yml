name: Quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run syntax
      - name: Verify all 11 original Python skill adapters are safe
        run: python3 -m unittest discover -s services/python-skills -p 'test_*.py' -v
      - name: Validate installed-app release marker
        env:
          RANGEFORM_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGEFORM_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-release-marker.mjs
